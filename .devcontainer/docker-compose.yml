
services:
  # Servicio de la Base de Datos
  db_insights:
    image: postgres:15
    restart: always

    env_file:
      - ../.env
    environment:
      # Definimos las credenciales iniciales
      # Docker lee el .env y configura Postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
    ports:
      # Mapea el puerto de Postgres para que puedas conectarte desde tu máquina local
      - "${POSTGRES_PORT_OUT}:${POSTGRES_PORT}"
    volumes:
      # *** CAMBIO CLAVE AQUÍ ***
      # Sintaxis: [Ruta Local] : [Ruta dentro del Contenedor]
      # Usaremos el path relativo al archivo docker-compose.yml
      # - ./../001_postgres_data/INSIGHT_BODY:/var/lib/postgresql/data
      # - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data
      # Persistencia: para que no pierdas tus datos al cerrar el contenedor
      # se guarda dentro del contenedor en /var/lib/postgresql/data, pero lo mapeamos a ./db_data en tu máquina local
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Limites de recursos para la base de datos
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 512M


  # Servicio de la Aplicación (donde vivirá VS Code)
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    env_file:
      - ../.env
    volumes:
      # Sincroniza tu código local con el contenedor
      - ..:/workspaces:cached
    # Mantiene el contenedor encendido para que VS Code se conecte
    command: sleep infinity
    depends_on:
      db_insights:
        condition: service_healthy
    environment:
      # Estas variables le dicen a Python cómo conectar con el servicio 'db'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_insights:${POSTGRES_PORT}/${POSTGRES_DB}
    ports:
      # Expone el puerto de la aplicación (si es necesario)
      # Puerto 8000: FastAPI app - No cambiar, otra aplicación usa este puerto
      - "8000:8000"
    # Limites de recursos para la aplicación
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2048M
        reservations:
          cpus: "1"
          memory: 1024M

