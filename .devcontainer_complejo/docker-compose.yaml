services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../:/workspace:cached
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://BODY_INSIGHTS_DB_USER:BODY_INSIGHTS_DB_PASSWORD@db:5432/BODY_INSIGHTS_DB
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: BODY_INSIGHTS_DB_USER
      POSTGRES_PASSWORD: BODY_INSIGHTS_DB_PASSWORD
      POSTGRES_DB: BODY_INSIGHTS_DB
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U BODY_INSIGHTS_DB_USER -d BODY_INSIGHTS_DB -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

