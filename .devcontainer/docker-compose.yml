
services:
  # Servicio de la Base de Datos
  db_insights:
    image: postgres:15
    restart: always

    env_file:
      - ../.env
    environment:
      # Definimos las credenciales iniciales
      # Docker lee el .env y configura Postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
    
    volumes:
      # Persistencia: para que no pierdas tus datos al cerrar el contenedor
      - postgres_data:/var/lib/postgresql/data

  # Servicio de la Aplicación (donde vivirá VS Code)
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    env_file:
      - ../.env
    volumes:
      # Sincroniza tu código local con el contenedor
      - ..:/workspaces:cached
    # Mantiene el contenedor encendido para que VS Code se conecte
    command: sleep infinity
    depends_on:
      - db_insights
    environment:
      # Estas variables le dicen a Python cómo conectar con el servicio 'db'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_insights:${POSTGRES_PORT}/${POSTGRES_DB}

volumes:
  postgres_data: